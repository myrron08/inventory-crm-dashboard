# Host nginx (Ubuntu on VPS). TLS terminates here; Docker client listens on 127.0.0.1:8080.
# Cert paths: certbot certonly --nginx -d tt.tex-home.cc

server {
  listen 80;
  listen [::]:80;
  server_name tt.tex-home.cc;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name tt.tex-home.cc;

  ssl_certificate /etc/letsencrypt/live/tt.tex-home.cc/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tt.tex-home.cc/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
